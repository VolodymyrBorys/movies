global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The app on the host (`npm run dev`, PORT=3000).
  - job_name: movies-api
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  # Server-side PostgreSQL view (connections by state, max_connections, pg_up).
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis memory, evictions, keyspace hits/misses, redis_up.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Worker process on the host (`npm run worker`, WORKER_METRICS_PORT=3002): outbox relay +
  # review consumer (P5.5).
  - job_name: movies-worker
    static_configs:
      - targets: ["host.docker.internal:3002"]

  # RabbitMQ on the host (Homebrew), built-in rabbitmq_prometheus plugin on :15692.
  # /metrics returns totals aggregated over all queues (no `queue` label): node health and
  # rabbitmq_global_* rates.
  - job_name: rabbitmq
    static_configs:
      - targets: ["host.docker.internal:15692"]

  # Per-queue series (DLQ depth, consumers per queue) for the alerts in the `messaging` group.
  # Only the two metric families needed, only vhost "/" (integration tests use movies_test):
  # /metrics/per-object would export every metric for every object — cardinality grows with
  # each queue. Series: rabbitmq_detailed_queue_messages{,_ready,_unacked}, ..._consumers.
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      vhost: ["/"]
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["host.docker.internal:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
