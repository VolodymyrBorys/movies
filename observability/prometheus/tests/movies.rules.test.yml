# Unit tests for alert rules:
#   docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool \
#     prom/prometheus:v3.4.0 test rules /p/tests/movies.rules.test.yml
#
# Series notation: 'a+bxN' = start at a, add b each interval, N more samples.

rule_files:
  - ../rules/movies.rules.yml

evaluation_interval: 1m

tests:
  - name: MoviesApiDown fires after 1m of failed scrapes
    interval: 1m
    input_series:
      - series: 'up{job="movies-api"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: MoviesApiDown
        exp_alerts: [] # pending (for: 1m)
      - eval_time: 4m
        alertname: MoviesApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: movies-api
            exp_annotations:
              summary: Prometheus cannot scrape the Movies API
              runbook_url: docs/progress/observability.md#moviesapidown

  - name: HighErrorRatio fires above 5% with real traffic
    interval: 1m
    input_series:
      # 60 ok + 12 failed per minute → 16.7% errors, 1.2 req/s
      - series: 'http_requests_total{job="movies-api", status_code="200"}'
        values: "0+60x20"
      - series: 'http_requests_total{job="movies-api", status_code="500"}'
        values: "0+12x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: More than 5% of Movies API requests fail with 5xx
              runbook_url: docs/progress/observability.md#higherrorratio

  - name: HighErrorRatio stays silent at near-zero traffic
    interval: 1m
    input_series:
      # 50% errors, but only ~0.03 req/s
      - series: 'http_requests_total{job="movies-api", status_code="200"}'
        values: "0+1x20"
      - series: 'http_requests_total{job="movies-api", status_code="500"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRatio
        exp_alerts: []

  - name: OutboxDeadLetters fires on the first dead letter (series pre-created at 0)
    interval: 1m
    input_series:
      - series: 'outbox_events_total{job="movies-api", result="dead_lettered"}'
        values: "0 0 0 1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: OutboxDeadLetters
        exp_alerts: []
      - eval_time: 4m
        alertname: OutboxDeadLetters
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A cache-invalidation event was dead-lettered and will not be retried
              runbook_url: docs/progress/observability.md#outboxdeadletters

  - name: OutboxBacklogTooOld fires when the oldest event stays over 2 minutes
    interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_age_seconds{job="movies-api"}'
        values: "0 30 90 150 210 270 330"
    alert_rule_test:
      - eval_time: 3m
        alertname: OutboxBacklogTooOld
        exp_alerts: [] # just crossed, pending
      - eval_time: 5m
        alertname: OutboxBacklogTooOld
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Oldest pending cache-invalidation event is older than 2 minutes
              runbook_url: docs/progress/observability.md#outboxbacklogtooold

  - name: OutboxBacklogStale fires when the refresh timestamp stops moving
    interval: 1m
    input_series:
      # In promtool, time() at eval_time T is T in seconds; refresh stops at 120s.
      - series: 'outbox_backlog_last_refresh_timestamp_seconds{job="movies-api"}'
        values: "0 60 120 120 120 120 120 120"
    alert_rule_test:
      - eval_time: 3m
        alertname: OutboxBacklogStale
        exp_alerts: [] # 180-120 = 60, not > 60
      - eval_time: 6m
        alertname: OutboxBacklogStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Outbox backlog metrics have not been refreshed for over a minute
              runbook_url: docs/progress/observability.md#outboxbacklogstale

  - name: OutboxBacklogStale ignores the worker's pre-created 0 timestamp (shared registry)
    interval: 1m
    input_series:
      # API gone (MoviesApiDown covers it); the worker exposes the series at 0.
      - series: 'outbox_backlog_last_refresh_timestamp_seconds{job="movies-worker"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxBacklogStale
        exp_alerts: []

  # --- messaging (P5.5) ------------------------------------------------------

  - name: WorkerDown fires after 1m of failed scrapes
    interval: 1m
    input_series:
      - series: 'up{job="movies-worker", instance="host.docker.internal:3002"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: WorkerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: movies-worker
              instance: host.docker.internal:3002
            exp_annotations:
              summary: Prometheus cannot scrape the worker (outbox relay and review consumer)
              runbook_url: docs/progress/observability.md#workerdown

  - name: RabbitMqDown covers both broker scrape jobs
    interval: 1m
    input_series:
      - series: 'up{job="rabbitmq"}'
        values: "1x5"
      - series: 'up{job="rabbitmq-detailed"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: RabbitMqDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: rabbitmq-detailed
            exp_annotations:
              summary: Prometheus cannot scrape RabbitMQ
              runbook_url: docs/progress/observability.md#rabbitmqdown

  - name: ReviewConsumersMissing fires when the consumer count drops to 0
    interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_consumers{vhost="/", queue="reviews.generate"}'
        values: "1 1 0 0 0 0"
      - series: 'up{job="rabbitmq-detailed"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: ReviewConsumersMissing
        exp_alerts: [] # pending (for: 2m)
      - eval_time: 5m
        alertname: ReviewConsumersMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              vhost: /
              queue: reviews.generate
            exp_annotations:
              summary: No consumer on reviews.generate; review jobs are not processed
              runbook_url: docs/progress/observability.md#reviewconsumersmissing

  - name: ReviewConsumersMissing fires when the queue is gone but the broker is scraped
    interval: 1m
    input_series:
      - series: 'up{job="rabbitmq-detailed"}'
        values: "1x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: ReviewConsumersMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              vhost: /
              queue: reviews.generate
            exp_annotations:
              summary: No consumer on reviews.generate; review jobs are not processed
              runbook_url: docs/progress/observability.md#reviewconsumersmissing

  - name: ReviewConsumersMissing stays silent while the broker is down (RabbitMqDown fires)
    interval: 1m
    input_series:
      - series: 'up{job="rabbitmq-detailed"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: ReviewConsumersMissing
        exp_alerts: []

  - name: ReviewDeadLetterQueueNotEmpty fires on the first message, without delay
    interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="reviews.generate.dlq"}'
        values: "0 0 2 2"
      # Other queues are never matched.
      - series: 'rabbitmq_detailed_queue_messages{vhost="/", queue="reviews.generate"}'
        values: "5 5 5 5"
    alert_rule_test:
      - eval_time: 1m
        alertname: ReviewDeadLetterQueueNotEmpty
        exp_alerts: []
      - eval_time: 2m
        alertname: ReviewDeadLetterQueueNotEmpty
        exp_alerts:
          - exp_labels:
              severity: warning
              vhost: /
              queue: reviews.generate.dlq
            exp_annotations:
              summary: reviews.generate.dlq holds 2 message(s)
              runbook_url: docs/progress/observability.md#reviewdeadletterqueuenotempty

  - name: ReviewQueueBacklog fires after 10m above 50 ready messages
    interval: 1m
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{vhost="/", queue="reviews.generate"}'
        values: "60x15"
    alert_rule_test:
      - eval_time: 9m
        alertname: ReviewQueueBacklog
        exp_alerts: []
      - eval_time: 11m
        alertname: ReviewQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              vhost: /
              queue: reviews.generate
            exp_annotations:
              summary: More than 50 review jobs have been waiting in reviews.generate for 10 minutes
              runbook_url: docs/progress/observability.md#reviewqueuebacklog

  - name: MessageOutboxBacklogTooOld uses the worker's series only
    interval: 1m
    input_series:
      - series: 'message_outbox_oldest_pending_age_seconds{job="movies-worker"}'
        values: "0 60 130 190 250 310"
      - series: 'message_outbox_oldest_pending_age_seconds{job="movies-api"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: MessageOutboxBacklogTooOld
        exp_alerts: [] # pending
      - eval_time: 4m
        alertname: MessageOutboxBacklogTooOld
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Oldest unpublished broker message in message_outbox is older than 2 minutes
              runbook_url: docs/progress/observability.md#messageoutboxbacklogtooold

  - name: MessageOutboxBacklogStale fires when the worker's refresh stops
    interval: 1m
    input_series:
      - series: 'message_outbox_backlog_last_refresh_timestamp_seconds{job="movies-worker"}'
        values: "0 60 120 120 120 120 120 120"
      # The API's pre-created 0 is ignored.
      - series: 'message_outbox_backlog_last_refresh_timestamp_seconds{job="movies-api"}'
        values: "0x7"
    alert_rule_test:
      - eval_time: 3m
        alertname: MessageOutboxBacklogStale
        exp_alerts: []
      - eval_time: 6m
        alertname: MessageOutboxBacklogStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: message_outbox backlog metrics have not been refreshed for over a minute
              runbook_url: docs/progress/observability.md#messageoutboxbacklogstale

  - name: MessageOutboxBacklogStale ignores the API's pre-created 0 when the worker is gone
    interval: 1m
    input_series:
      # Worker gone (WorkerDown covers it); the API exposes the series at 0.
      - series: 'message_outbox_backlog_last_refresh_timestamp_seconds{job="movies-api"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: MessageOutboxBacklogStale
        exp_alerts: []

  - name: MessageOutboxDeadLetters fires while dead-lettered rows exist
    interval: 1m
    input_series:
      - series: 'message_outbox_dead_lettered_messages{job="movies-worker"}'
        values: "0 3 3 0"
    alert_rule_test:
      - eval_time: 0m
        alertname: MessageOutboxDeadLetters
        exp_alerts: []
      - eval_time: 1m
        alertname: MessageOutboxDeadLetters
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "3 message_outbox row(s) dead-lettered by the relay and never published"
              runbook_url: docs/progress/observability.md#messageoutboxdeadletters
      - eval_time: 3m
        alertname: MessageOutboxDeadLetters
        exp_alerts: [] # re-queued by the operator

  - name: CacheErrors is a warning, not critical
    interval: 1m
    input_series:
      - series: 'cache_requests_total{cache="movies_list", result="error"}'
        values: "0+5x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: CacheErrors
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Movies list cache lookups are failing (serving from PostgreSQL)
              runbook_url: docs/progress/observability.md#cacheerrors

  - name: PgPoolWaiting fires per pool
    interval: 1m
    input_series:
      - series: 'pg_pool_connections{pool="read", state="waiting"}'
        values: "0 2 3 3 4 4"
      - series: 'pg_pool_connections{pool="write", state="waiting"}'
        values: "0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: PgPoolWaiting
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: read
            exp_annotations:
              summary: Requests are queueing for a PostgreSQL pool connection
              runbook_url: docs/progress/observability.md#pgpoolwaiting

  - name: RedisDown is a warning; PostgresDown is critical
    interval: 1m
    input_series:
      - series: 'redis_up{job="redis"}'
        values: "1 0 0 0"
      - series: 'pg_up{job="postgres"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: redis
            exp_annotations:
              summary: redis_exporter cannot connect to Redis
              runbook_url: docs/progress/observability.md#redisdown
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: postgres
            exp_annotations:
              summary: postgres_exporter cannot connect to PostgreSQL
              runbook_url: docs/progress/observability.md#postgresdown
