# SLOs for GET /v1/movies with multi-window, multi-burn-rate alerts
# (Google SRE Workbook, ch. 5 "Alerting on SLOs").
# Runbooks: docs/progress/observability.md#slos-and-burn-rate-alerts
# Tests:    observability/prometheus/tests/slo.rules.test.yml
#
#   SLO                     SLI (good / total)                            target   window
#   movies_list_availability  non-5xx responses / all responses             99.5%    30d
#   movies_list_latency       requests <= 250 ms / all requests              99%      30d
#
# - 4xx are client errors and count as good for availability.
# - 250 ms (not 200) because 0.25 is a histogram bucket boundary: counting requests under
#   a threshold is exact only at a bucket edge (no interpolation, unlike histogram_quantile).
# - Targets are initial guesses; revisit them with P2 baseline numbers.
#
# Error budget = 1 - target (availability 0.005, latency 0.01).
# Burn rate N = errors arrive N times faster than the budget allows over 30d.
#
#   alert   burn rate   long / short window   budget spent when it fires
#   Fast    14.4        1h / 5m               2%
#   Fast    6           6h / 30m              5%
#   Slow    1           3d / 6h               10%
#
# Both windows must exceed the threshold: the long one proves the burn is significant,
# the short one makes the alert resolve soon after the burn stops.
#
# LAB: simplified — production would also:
#   - derive the 3d ratios from recorded short-window rates instead of rate(...[3d]) on raw
#     series (cheaper per evaluation);
#   - track remaining 30d budget, which needs >= 30d retention (local Prometheus keeps 7d);
#   - tune the minimum-traffic guards to real traffic (P2).

groups:
  - name: slo-recording
    rules:
      # Availability error ratio = 1 - non-5xx / all. Written as "1 - good/total" so it is
      # 0 (not empty) when no 5xx series exists yet. No traffic in the window → NaN → no alert.
      - record: slo:movies_list_availability_errors:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies", status_code!~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[5m]))
          )
      - record: slo:movies_list_availability_errors:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies", status_code!~"5.."}[30m]))
              /
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[30m]))
          )
      - record: slo:movies_list_availability_errors:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies", status_code!~"5.."}[1h]))
              /
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[1h]))
          )
      - record: slo:movies_list_availability_errors:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies", status_code!~"5.."}[6h]))
              /
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[6h]))
          )
      - record: slo:movies_list_availability_errors:ratio_rate3d
        expr: |
          1 - (
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies", status_code!~"5.."}[3d]))
              /
            sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[3d]))
          )

      # Latency error ratio = 1 - (requests <= 0.25 s) / all requests (any status code).
      - record: slo:movies_list_latency_errors:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="movies-api", method="GET", route="/v1/movies", le="0.25"}[5m]))
              /
            sum(rate(http_request_duration_seconds_count{job="movies-api", method="GET", route="/v1/movies"}[5m]))
          )
      - record: slo:movies_list_latency_errors:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="movies-api", method="GET", route="/v1/movies", le="0.25"}[30m]))
              /
            sum(rate(http_request_duration_seconds_count{job="movies-api", method="GET", route="/v1/movies"}[30m]))
          )
      - record: slo:movies_list_latency_errors:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="movies-api", method="GET", route="/v1/movies", le="0.25"}[1h]))
              /
            sum(rate(http_request_duration_seconds_count{job="movies-api", method="GET", route="/v1/movies"}[1h]))
          )
      - record: slo:movies_list_latency_errors:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="movies-api", method="GET", route="/v1/movies", le="0.25"}[6h]))
              /
            sum(rate(http_request_duration_seconds_count{job="movies-api", method="GET", route="/v1/movies"}[6h]))
          )
      - record: slo:movies_list_latency_errors:ratio_rate3d
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{job="movies-api", method="GET", route="/v1/movies", le="0.25"}[3d]))
              /
            sum(rate(http_request_duration_seconds_count{job="movies-api", method="GET", route="/v1/movies"}[3d]))
          )

      # Request rate over the long windows: minimum-traffic guard. At lab traffic levels
      # 1 failure out of 2 requests is a 50% error ratio (~100x burn) — not worth a page.
      - record: slo:movies_list_requests:rate1h
        expr: sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[1h]))
      - record: slo:movies_list_requests:rate6h
        expr: sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[6h]))
      - record: slo:movies_list_requests:rate3d
        expr: sum(rate(http_requests_total{job="movies-api", method="GET", route="/v1/movies"}[3d]))

  - name: slo-alerts
    rules:
      # Guards: >= 0.1 req/s for the fast windows (≥ 360 requests per 1h),
      # >= 0.01 req/s for the 3d window (≥ ~2600 requests). LAB: guesses until P2.

      - alert: MoviesListAvailabilityBudgetBurnFast
        expr: |
          (
            slo:movies_list_availability_errors:ratio_rate1h > (14.4 * 0.005)
            and
            slo:movies_list_availability_errors:ratio_rate5m > (14.4 * 0.005)
            and
            slo:movies_list_requests:rate1h > 0.1
          )
          or
          (
            slo:movies_list_availability_errors:ratio_rate6h > (6 * 0.005)
            and
            slo:movies_list_availability_errors:ratio_rate30m > (6 * 0.005)
            and
            slo:movies_list_requests:rate6h > 0.1
          )
        labels:
          severity: critical
          slo: movies_list_availability
        annotations:
          summary: GET /v1/movies 5xx are burning the availability error budget fast (≥2% of 30d budget in 1h or ≥5% in 6h)
          runbook_url: docs/progress/observability.md#movieslistavailabilitybudgetburn

      - alert: MoviesListAvailabilityBudgetBurnSlow
        expr: |
          slo:movies_list_availability_errors:ratio_rate3d > (1 * 0.005)
          and
          slo:movies_list_availability_errors:ratio_rate6h > (1 * 0.005)
          and
          slo:movies_list_requests:rate3d > 0.01
        labels:
          severity: warning
          slo: movies_list_availability
        annotations:
          summary: GET /v1/movies 5xx are consuming the availability error budget faster than it accrues (≥10% of 30d budget in 3d)
          runbook_url: docs/progress/observability.md#movieslistavailabilitybudgetburn

      - alert: MoviesListLatencyBudgetBurnFast
        expr: |
          (
            slo:movies_list_latency_errors:ratio_rate1h > (14.4 * 0.01)
            and
            slo:movies_list_latency_errors:ratio_rate5m > (14.4 * 0.01)
            and
            slo:movies_list_requests:rate1h > 0.1
          )
          or
          (
            slo:movies_list_latency_errors:ratio_rate6h > (6 * 0.01)
            and
            slo:movies_list_latency_errors:ratio_rate30m > (6 * 0.01)
            and
            slo:movies_list_requests:rate6h > 0.1
          )
        labels:
          severity: critical
          slo: movies_list_latency
        annotations:
          summary: GET /v1/movies requests slower than 250 ms are burning the latency error budget fast (≥2% of 30d budget in 1h or ≥5% in 6h)
          runbook_url: docs/progress/observability.md#movieslistlatencybudgetburn

      - alert: MoviesListLatencyBudgetBurnSlow
        expr: |
          slo:movies_list_latency_errors:ratio_rate3d > (1 * 0.01)
          and
          slo:movies_list_latency_errors:ratio_rate6h > (1 * 0.01)
          and
          slo:movies_list_requests:rate3d > 0.01
        labels:
          severity: warning
          slo: movies_list_latency
        annotations:
          summary: GET /v1/movies requests slower than 250 ms are consuming the latency error budget faster than it accrues (≥10% of 30d budget in 3d)
          runbook_url: docs/progress/observability.md#movieslistlatencybudgetburn
